# Порог в USD. Контракты с total_usd >= min_usd -> qualifying.xlsx
# 0 < total_usd < min_usd -> below_threshold.xlsx
# total_usd == 0 в Excel не попадают.
min_usd: 100000

db_path: data/contracts.db
export_dir: reports
log_dir: logs

# Как часто перепроверять уже просканированные контракты (секунды)
recheck_interval_sec: 86400

# Параллельность. На публичных RPC лучше не задирать.
rpc_concurrency: 4
balance_concurrency: 6
block_batch_size: 8
receipt_batch_size: 20
price_batch_size: 40
http_timeout_sec: 40
max_retries: 8

# Rate limit / паузы
cooldown_min_sec: 5
cooldown_max_sec: 900          # 15 минут максимум сна одной ноды
all_down_sleep_sec: 30         # если все RPC сети в кулдауне
adaptive_batch: true           # резать размер батча при лимитах, потом отращивать

# Автономный режим
heartbeat_sec: 600             # статус в лог и logs/status.txt
export_every_sec: 300          # живые xlsx перезаписываются
daily_snapshot: true           # раз в сутки копия в reports/archive/
task_restart_sec: 20           # если воркер сети упал — поднять снова

# Индексатор + чекер балансов работают одновременно
run_indexer: true
run_balance_checker: true

# Искать ERC-20 Transfer в тех же блоках и запоминать токены,
# которые реально приходили на уже известные контракты
discover_tokens_from_transfers: true

