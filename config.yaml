# Порог в USD. Контракты с total_usd >= min_usd -> qualifying.xlsx
# 0 < total_usd < min_usd -> below_threshold.xlsx
# total_usd == 0 в Excel не попадают.
min_usd: 100000

db_path: data/contracts.db
export_dir: reports

# Как часто перепроверять уже просканированные контракты (секунды)
recheck_interval_sec: 86400

# Параллельность
rpc_concurrency: 8
balance_concurrency: 12
block_batch_size: 15          # сколько блоков тянуть за раз (eth_getBlockByNumber)
receipt_batch_size: 40
price_batch_size: 40
http_timeout_sec: 40
max_retries: 5

# Индексатор + чекер балансов работают одновременно
run_indexer: true
run_balance_checker: true

# Искать ERC-20 Transfer в тех же блоках и запоминать токены,
# которые реально приходили на уже известные контракты
discover_tokens_from_transfers: true

